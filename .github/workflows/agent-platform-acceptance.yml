name: Agent platform acceptance

on:
  pull_request:
    paths: ['agent_platform/**', 'chat_models/**', '.dockerignore', 'pyproject.toml', 'uv.lock', '.github/workflows/agent-platform-acceptance.yml']
  push:
    paths: ['agent_platform/**', 'chat_models/**', '.dockerignore', 'pyproject.toml', 'uv.lock', '.github/workflows/agent-platform-acceptance.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: agent-platform-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: agent_platform_acceptance
          POSTGRES_USER: acceptance_owner
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acceptance_owner -d agent_platform_acceptance"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PLATFORM_ACCEPTANCE_POSTGRES_URL: postgresql://acceptance_owner:disposable-ci-only@127.0.0.1:5432/agent_platform_acceptance
      PLATFORM_ACCEPTANCE_POSTGRES_ISOLATED: '1'
      PLATFORM_ACCEPTANCE_REDIS_URL: redis://127.0.0.1:6379/0
      PLATFORM_ACCEPTANCE_REDIS_ISOLATED: '1'
      PLATFORM_ACCEPTANCE_DOCKER_ISOLATED: '1'
      PLATFORM_ACCEPTANCE_POSTGRES_IMAGE: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install dependencies from the committed lockfile
        run: |
          python -m pip install uv==0.10.12
          uv sync --frozen --all-groups
      - name: Install verified Helm chart renderer
        run: |
          tool_dir=$(mktemp -d)
          curl --proto '=https' --proto-redir '=https' --fail --location --connect-timeout 10 --max-time 180 --output "$tool_dir/helm.tar.gz" https://get.helm.sh/helm-v4.0.4-linux-amd64.tar.gz
          printf '%s  %s\n' '29454bc351f4433e66c00f5d37841627cbbcc02e4c70a6d796529d355237671c' "$tool_dir/helm.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/helm.tar.gz" -C "$tool_dir" linux-amd64/helm
          printf '%s\n' "$tool_dir/linux-amd64" >> "$GITHUB_PATH"
      - name: Frontend build from the committed lockfile
        run: |
          npm --prefix agent_platform/apps/web ci --ignore-scripts --no-audit --no-fund
          npm --prefix agent_platform/apps/web run build
      - name: Current suite and real PostgreSQL isolation gate
        run: uv run --frozen python -m agent_platform.scripts.acceptance --report /tmp/agent-platform-acceptance.json
      - name: Upload sanitized acceptance metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-platform-acceptance-${{ github.sha }}
          path: /tmp/agent-platform-acceptance.json
          if-no-files-found: ignore
          retention-days: 14
