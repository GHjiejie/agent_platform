# Each chart deploys one service and references existing dependencies.
# Supply credentials with Kubernetes Secrets; do not put them in values files.
fullnameOverride: api
image:
  repository: agent-platform-api
  tag: 0.3.0-helm
  pullPolicy: IfNotPresent
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 768Mi
# The default database is an external PostgreSQL runtime connection.
# A plaintext URL is accepted only for SQLite local compatibility.
database:
  existingSecret: platform-api-database-secret
  urlKey: PLATFORM_DATABASE_URL
  url: ""
# SQLite cannot run across nodes. Local values pin its existing RWO volume.
sqliteStorage:
  enabled: false
  existingClaim: platform-data
  mountPath: /app/agent_platform/.data
replicaCount: 1
strategy:
  type: RollingUpdate
terminationGracePeriodSeconds: 360
config:
  collaborationEnabled: false
  collaborationDynamicEnabled: false
  collaborationParallelEnabled: false
  collaborationDurableEnabled: false
  collaborationRecoveryEnabled: false
  collaborationDistributedEnabled: false
  remoteAgentsEnabled: false
  remoteAgentAllowedOrigins: []
  collaborationMaxActiveMembers: 8
  collaborationCapacityWaitSeconds: 30
  mode: saas
  redisUrl: redis://redis:6379/0
  secureCookies: true
  litellmUrl: http://litellm:4000/v1
  litellmAdminUrl: ""
  maxRunCost: "1"
# Only the encryption key is projected; the entire Secret is never imported.
runtimeSecret:
  existingSecret: platform-runtime-secret
  encryptionKey: PLATFORM_SECRET_ENCRYPTION_KEY
# Compatibility with the original single-tenant restricted LiteLLM key.
# Enable only in the local profile. SaaS credentials are per-tenant DB records.
legacyGateway:
  enabled: false
  existingSecret: platform-runtime-secret
  key: PLATFORM_LITELLM_KEY
# API and maintenance must see the same private export files.
# This chart references storage owned by the storage administrator.
exports:
  enabled: true
  existingClaim: platform-exports
  mountPath: /var/lib/agent-platform/exports
  # API only reads immutable files generated by maintenance.
  readOnly: true
service:
  type: ClusterIP
  port: 8000
  annotations: {}
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 60
  readiness:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 6
