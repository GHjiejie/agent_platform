apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgres.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: platform-{{ include "postgres.fullname" . }}
  template:
    metadata:
      labels:
        app: platform-{{ include "postgres.fullname" . }}
        {{- include "postgres.labels" . | nindent 8 }}
      annotations:
        checksum/bootstrap: {{ include (print $.Template.BasePath "/bootstrap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.adminPasswordKey }}
            - {name: POSTGRES_USER, value: {{ .Values.admin.user | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.admin.database | quote }}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            {{- if .Values.bootstrap.litellm.enabled }}
            - name: LITELLM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.existingSecret }}
                  key: {{ .Values.credentials.litellmPasswordKey }}
            {{- end }}
          ports:
            - {name: postgres, containerPort: 5432}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.admin.user | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [psql, -U, {{ .Values.admin.user | quote }}, -d, {{ .Values.admin.database | quote }}, -Atc, "SELECT 1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [pg_isready, -U, {{ .Values.admin.user | quote }}]
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            {{- if .Values.bootstrap.litellm.enabled }}
            - {name: bootstrap, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            {{- end }}
      {{- if .Values.bootstrap.litellm.enabled }}
      volumes:
        - name: bootstrap
          configMap:
            name: {{ include "postgres.fullname" . }}-bootstrap
            defaultMode: 493
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
