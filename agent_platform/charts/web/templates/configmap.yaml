apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "web.fullname" . }}-config
  labels: {{ include "web.labels" . | nindent 4 }}
data:
  server.conf: |
    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size {{ .Values.config.maxBodySize }};
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }
        location /api/ {
            proxy_pass {{ .Values.config.apiUpstream }};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # Responses can be SSE and must be flushed while the request stays open.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout {{ .Values.config.streamTimeoutSeconds }}s;
            proxy_send_timeout {{ .Values.config.streamTimeoutSeconds }}s;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
