apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app: platform-{{ include "redis.fullname" . }}
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: 6379
