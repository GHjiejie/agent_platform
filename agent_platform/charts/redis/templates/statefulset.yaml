apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "redis.fullname" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "redis.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: platform-{{ include "redis.fullname" . }}
  template:
    metadata:
      labels:
        app: platform-{{ include "redis.fullname" . }}
        {{- include "redis.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.auth.existingSecret }}
          # Keep the password out of command arguments and rendered manifests.
          command: [sh, -ec]
          args:
            - |
              umask 077
              awk 'BEGIN {
                password = ENVIRON["REDIS_PASSWORD"];
                if (length(password) == 0) exit 2;
                print "appendonly yes";
                print "maxmemory-policy noeviction";
                printf "requirepass \"";
                for (i = 1; i <= length(password); i++) {
                  c = substr(password, i, 1);
                  if (c == "\\") printf "\\\\";
                  else if (c == "\"") printf "\\\"";
                  else if (c == "\n") printf "\\n";
                  else if (c == "\r") printf "\\r";
                  else if (c == "\t") printf "\\t";
                  else printf "%s", c;
                }
                print "\"";
              }' > /tmp/redis.conf
              exec redis-server /tmp/redis.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
          {{- else }}
          args: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
          {{- end }}
          ports:
            - {name: redis, containerPort: 6379}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli ping)" = PONG']}
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
