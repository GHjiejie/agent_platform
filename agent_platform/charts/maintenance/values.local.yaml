# Existing OrbStack SQLite deployment only; every role remains single replica.
# Do not use this profile for multi-node or production PostgreSQL deployments.
database:
  url: sqlite:////app/agent_platform/.data/platform.db
sqliteStorage:
  enabled: true
  existingClaim: platform-data
nodeSelector:
  kubernetes.io/hostname: orbstack
replicaCount: 1
strategy:
  type: Recreate
config:
  mode: local
# Already backed by platform-data: no second volume for the nested directory.
exports:
  enabled: false
  mountPath: /app/agent_platform/.data/exports
tombstones:
  mountPath: /app/agent_platform/.tombstones
